# Render Blueprint for the bandit API (free plan). See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: adaptive-form-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Bandit state lives in process memory, so it must stay a single worker.
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      # Restrict browser CORS to the Vercel site once you know its URL, e.g. https://nimbus-demo.vercel.app
      - key: FLASK_ALLOWED_ORIGINS
        value: "*"
